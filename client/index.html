<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>GovtJobsNow - Official Job Portal</title>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered!', reg))
          .catch(err => console.log('SW registration failed', err));
      });
    }
  </script>
  <meta name="description"
    content="Find the latest government jobs, exam calendars, syllabus, and admit cards on GovtJobsNow. 100% verified opportunities across banking, railways, defense, and PSU sectors." />
  <meta name="keywords"
    content="Government Jobs, Sarkari Naukri, SSC Jobs, Railway Jobs, Banking Jobs, UPSC, PSU Jobs, Latest Govt Jobs 2026, Exam Calendar" />
  <meta name="author" content="GovtJobsNow" />
  <meta property="og:title" content="GovtJobsNow - Your Gateway to Government Careers" />
  <meta property="og:description"
    content="Discover thousands of verified government jobs and get instant updates on exam dates and results." />
  <meta property="og:type" content="website" />
  <meta name="google-site-verification" content="6SyfPOkqzXoyOld4_JQTJpPZMxX0dOxrqlJFhpP-1mo" />
  <meta name="google-adsense-account" content="ca-pub-1815096689563523" />
</head>


<body>
  <div id="root">
    <!-- Instant Loading Skeleton for First Paint -->
    <div style="min-height: 100vh; background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
      <!-- Skeleton Header -->
      <div style="background-color: #1e3a8a; height: 60px; display: flex; align-items: center; padding: 0 20px; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 32px; height: 32px; background-color: #3b82f6; border-radius: 6px;"></div>
          <div style="width: 140px; height: 20px; background-color: #3b82f6; border-radius: 4px; opacity: 0.7;"></div>
        </div>
      </div>
      <!-- Skeleton Container -->
      <div style="max-width: 1280px; margin: 20px auto; padding: 0 16px;">
        <div style="height: 40px; background-color: #e2e8f0; border-radius: 8px; margin-bottom: 20px;"></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 24px;">
          <div style="height: 70px; background-color: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0;"></div>
          <div style="height: 70px; background-color: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0;"></div>
          <div style="height: 70px; background-color: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0;"></div>
          <div style="height: 70px; background-color: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0;"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
